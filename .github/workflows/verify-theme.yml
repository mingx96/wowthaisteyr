name: Verify WordPress theme

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Run repository verification gates
        run: node dev/verify.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install portal browser test runtime
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Run synthetic portal browser regressions
        env:
          PORTAL_TEST_ARTIFACTS: ${{ runner.temp }}/portal-artifacts
        run: python dev/tests/portal.browser.py
      - name: Run synthetic public hours browser regressions
        run: python dev/tests/hours-public.browser.py
      - name: Run public mobile design regressions
        run: python dev/tests/public-design.browser.py
      - name: Run homepage discovery regressions
        env:
          HOMEPAGE_TEST_ARTIFACTS: ${{ runner.temp }}/homepage-artifacts
        run: python dev/tests/homepage.browser.py
      - name: Save synthetic portal screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-browser-screenshots
          path: ${{ runner.temp }}/portal-artifacts
          if-no-files-found: ignore
      - name: Save homepage screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-browser-screenshots
          path: ${{ runner.temp }}/homepage-artifacts
          if-no-files-found: ignore
